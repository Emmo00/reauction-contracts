[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
solc = "0.8.30"
via_ir = true
# solc_path = "/usr/bin/solc"


# RPC endpoints
[rpc_endpoints]
base_sepolia = "${TESTNET_RPC_URL}"
base_mainnet = "${MAINNET_RPC_URL}"

# Etherscan configuration
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}" }
base = { key = "${BASESCAN_API_KEY}" }
